spring:
  application:
    name: finpilot-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finpilot}
    username: ${DB_USERNAME:finpilot}
    password: ${DB_PASSWORD:local-dev-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  shutdown: graceful
